{% if request.user.is_authenticated and request.user.is_staff %}
<!-- ═══ دکمه شناور نمونه‌کارها ═══ -->
<div class="fab-wrapper">
    <input type="checkbox" id="fabPortfolioCheckbox" class="fab-checkbox">
    
    <label for="fabPortfolioCheckbox" class="fab-label" aria-label="منوی نمونه‌کارها">
        <svg class="fab-icon fab-icon-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
        <svg class="fab-icon fab-icon-close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
    </label>
    
    <div class="fab-menu">
        {% if item %}
        <a href="{% url 'panel:portfolio_edit' item.id %}" class="fab-link">
            <span class="fab-link-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
                    <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
                </svg>
            </span>
            <span class="fab-link-text">ویرایش نمونه‌کار</span>
        </a>
        {% endif %}
        
        <a href="{% url 'panel:portfolio_list' %}" class="fab-link">
            <span class="fab-link-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="8" y1="6" x2="21" y2="6"/>
                    <line x1="8" y1="12" x2="21" y2="12"/>
                    <line x1="8" y1="18" x2="21" y2="18"/>
                    <line x1="3" y1="6" x2="3.01" y2="6"/>
                    <line x1="3" y1="12" x2="3.01" y2="12"/>
                    <line x1="3" y1="18" x2="3.01" y2="18"/>
                </svg>
            </span>
            <span class="fab-link-text">لیست نمونه‌کارها</span>
        </a>
        
        <a href="{% url 'panel:portfolio_add' %}" class="fab-link">
            <span class="fab-link-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                    <polyline points="14 2 14 8 20 8"/>
                    <line x1="12" y1="18" x2="12" y2="12"/>
                    <line x1="9" y1="15" x2="15" y2="15"/>
                </svg>
            </span>
            <span class="fab-link-text">نمونه‌کار جدید</span>
        </a>
    </div>
</div>

<style>
.fab-wrapper {
    position: fixed;
    bottom: 40px;
    left: 40px;
    z-index: 9999;
}

.fab-checkbox {
    position: absolute;
    width: 1px;
    height: 1px;
    opacity: 0;
    pointer-events: none;
}

.fab-label {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 64px;
    height: 64px;
    background: linear-gradient(135deg, #ff6b00 0%, #ff9a4d 100%);
    border-radius: 50%;
    cursor: pointer;
    box-shadow: 0 10px 35px rgba(255, 107, 0, 0.4);
    transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
    z-index: 10;
}

.fab-label:hover {
    transform: scale(1.08) rotate(90deg);
    box-shadow: 0 15px 45px rgba(255, 107, 0, 0.5);
}

.fab-checkbox:checked + .fab-label {
    transform: rotate(45deg);
    box-shadow: 0 8px 30px rgba(255, 107, 0, 0.3);
}

.fab-icon {
    position: absolute;
    width: 28px;
    height: 28px;
    color: #fff;
    transition: all 0.3s ease;
}

.fab-icon-plus {
    opacity: 1;
    transform: rotate(0deg) scale(1);
}

.fab-icon-close {
    opacity: 0;
    transform: rotate(90deg) scale(0);
}

.fab-checkbox:checked + .fab-label .fab-icon-plus {
    opacity: 0;
    transform: rotate(-90deg) scale(0);
}

.fab-checkbox:checked + .fab-label .fab-icon-close {
    opacity: 1;
    transform: rotate(0deg) scale(1);
}

.fab-menu {
    position: absolute;
    bottom: 80px;
    left: 0;
    display: flex;
    flex-direction: column;
    gap: 12px;
    pointer-events: none;
}

.fab-link {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 20px;
    background: rgba(26, 26, 32, 0.98);
    border: 1px solid rgba(255, 107, 0, 0.2);
    border-radius: 14px;
    text-decoration: none;
    color: #fff;
    font-size: 0.9rem;
    font-weight: 700;
    white-space: nowrap;
    box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
    opacity: 0;
    transform: translateY(20px) scale(0.85);
    transform-origin: bottom left;
    transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
    pointer-events: none;
}

.fab-checkbox:checked ~ .fab-menu .fab-link {
    opacity: 1;
    transform: translateY(0) scale(1);
    pointer-events: auto;
}

.fab-checkbox:checked ~ .fab-menu .fab-link:nth-child(1) {
    transition-delay: 0.05s;
}

.fab-checkbox:checked ~ .fab-menu .fab-link:nth-child(2) {
    transition-delay: 0.1s;
}

.fab-checkbox:checked ~ .fab-menu .fab-link:nth-child(3) {
    transition-delay: 0.15s;
}

.fab-link:hover {
    background: rgba(255, 107, 0, 0.15);
    border-color: rgba(255, 107, 0, 0.5);
    transform: translateX(-8px) scale(1.03);
    box-shadow: 0 12px 35px rgba(255, 107, 0, 0.3);
}

.fab-link-icon {
    width: 36px;
    height: 36px;
    background: rgba(255, 107, 0, 0.15);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
}

.fab-link-icon svg {
    width: 20px;
    height: 20px;
    color: #ff9a4d;
}

.fab-link-text {
    font-family: inherit;
}

@media (max-width: 768px) {
    .fab-wrapper {
        bottom: 25px;
        left: 25px;
    }
    
    .fab-label {
        width: 56px;
        height: 56px;
    }
    
    .fab-icon {
        width: 24px;
        height: 24px;
    }
    
    .fab-menu {
        bottom: 70px;
    }
    
    .fab-link {
        padding: 10px 16px;
        font-size: 0.85rem;
    }
    
    .fab-link-icon {
        width: 32px;
        height: 32px;
    }
}
</style>
{% endif %}
