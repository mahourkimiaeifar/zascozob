{% load static %}
<!doctype html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}وبلاگ{% endblock %} | زاسکو ذوب</title>
    <meta name="description" content="{% block meta_description %}مقالات تخصصی ریخته‌گری و صنعت{% endblock %}">
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/blog.css' %}">
    {% block extra_css %}{% endblock %}
</head>

<body>
    {% include 'partials/blog_navbar.html' %}

    <main class="blog-main">
        {% block content %}{% endblock %}
    </main>

    {% include 'partials/blog_footer.html' %}
    <script src="{% static 'js/blog.js' %}"></script>
    {% block extra_js %}{% endblock %}
</body>

</html>
