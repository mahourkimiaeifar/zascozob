{% load static %}
<!doctype html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}وبلاگ{% endblock %} | زاسکو ذوب</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
    <style>
:root{--bg-dark:#0b0d10;--bg-card:#141419;--primary:#ff6b00;--primary-light:#ff9a4d;--primary-glow:rgba(255,107,0,.3);--text-main:#eef1f6;--text-muted:#9aa3b2;--text-dim:#6b7482;--line:rgba(255,255,255,.09);--line-hover:rgba(255,255,255,.15);--radius:14px;--radius-lg:20px;--transition:.3s cubic-bezier(.22,1,.36,1)}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:'Vazirmatn',sans-serif;background:var(--bg-dark);color:var(--text-main);line-height:1.8;overflow-x:hidden}
.container{max-width:1200px;margin:0 auto;padding:0 24px}
a{text-decoration:none;color:inherit;transition:var(--transition)}
img{max-width:100%;display:block}
.grad-text{background:linear-gradient(120deg,var(--primary),var(--primary-light));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.blog-navbar{position:sticky;top:0;z-index:100;background:rgba(11,13,16,.85);backdrop-filter:blur(20px);border-bottom:1px solid var(--line)}
.nav-container{display:flex;justify-content:space-between;align-items:center;height:70px}
.logo{font-size:1.4rem;font-weight:800}
.highlight{color:var(--primary)}
.nav-links{display:flex;gap:28px;list-style:none}
.nav-links a{color:var(--text-muted);font-weight:500;position:relative}
.nav-links a:hover,.nav-links a.active{color:var(--primary)}
.nav-links a.active::after{content:'';position:absolute;bottom:-8px;right:0;left:0;height:2px;background:var(--primary);border-radius:2px}
.nav-cta{padding:10px 24px;background:linear-gradient(135deg,var(--primary),var(--primary-light));color:#fff;border-radius:10px;font-weight:700;font-size:.9rem;box-shadow:0 6px 18px var(--primary-glow)}
.nav-cta:hover{transform:translateY(-2px);box-shadow:0 10px 26px var(--primary-glow)}
.blog-hero{padding:110px 0 70px;text-align:center;position:relative;overflow:hidden;background:radial-gradient(ellipse at 50% 0%,rgba(255,107,0,.15),transparent 60%)}
.blog-hero::before{content:'';position:absolute;inset:0;background-image:linear-gradient(rgba(255,107,0,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,107,0,.04) 1px,transparent 1px);background-size:50px 50px;mask-image:radial-gradient(ellipse at center,black 20%,transparent 70%);pointer-events:none}
.blog-hero h1{font-size:clamp(2.2rem,5.5vw,3.8rem);font-weight:900;margin-bottom:16px;line-height:1.2;position:relative}
.blog-hero p{color:var(--text-muted);font-size:1.1rem;max-width:560px;margin:0 auto;position:relative}
.hero-pill{display:inline-flex;align-items:center;gap:8px;padding:8px 18px;background:rgba(255,107,0,.1);border:1px solid rgba(255,107,0,.3);border-radius:999px;color:var(--primary-light);font-size:.82rem;font-weight:700;margin-bottom:20px;position:relative}
.hero-pill::before{content:'';width:8px;height:8px;border-radius:50%;background:var(--primary);box-shadow:0 0 12px var(--primary);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 var(--primary-glow)}50%{box-shadow:0 0 0 8px rgba(255,107,0,0)}}
.blog-content{padding:50px 0 100px}
.blog-layout{display:grid;grid-template-columns:1fr 280px;gap:40px;align-items:start}
.blog-sidebar{position:sticky;top:90px;display:flex;flex-direction:column;gap:20px}
.sidebar-box{background:var(--bg-card);border:1px solid var(--line);border-radius:var(--radius-lg);padding:24px}
.sidebar-box h3{font-size:1rem;margin-bottom:16px;color:var(--primary-light);font-weight:800;display:flex;align-items:center;gap:8px}
.sidebar-box h3::before{content:'';width:3px;height:16px;background:var(--primary);border-radius:2px}
.search-form{display:flex;gap:8px}
.search-form input{flex:1;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:10px;padding:10px 14px;color:#fff;font-family:inherit;font-size:.9rem;outline:none;transition:var(--transition)}
.search-form input:focus{border-color:var(--primary);background:rgba(255,107,0,.04)}
.search-form button{padding:10px 16px;background:var(--primary);border:none;border-radius:10px;cursor:pointer;color:#fff;font-size:1rem;transition:var(--transition)}
.search-form button:hover{background:var(--primary-light)}
.category-list{list-style:none;display:flex;flex-direction:column;gap:4px}
.category-list a{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-radius:8px;color:var(--text-muted);font-size:.9rem;transition:var(--transition)}
.category-list a::before{content:'•';color:var(--text-dim);margin-left:8px;transition:var(--transition)}
.category-list a:hover,.category-list a.active{background:rgba(255,107,0,.08);color:var(--primary-light)}
.category-list a:hover::before,.category-list a.active::before{color:var(--primary)}
.posts-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:24px}
.post-card{background:var(--bg-card);border:1px solid var(--line);border-radius:var(--radius-lg);overflow:hidden;transition:var(--transition);display:flex;flex-direction:column;position:relative}
.post-card::before{content:'';position:absolute;top:0;right:0;left:0;height:3px;background:linear-gradient(90deg,transparent,var(--primary),transparent);opacity:0;transition:var(--transition)}
.post-card:hover{transform:translateY(-6px);border-color:rgba(255,107,0,.3);box-shadow:0 20px 50px rgba(0,0,0,.4)}
.post-card:hover::before{opacity:1}
.post-image{display:block;aspect-ratio:16/10;overflow:hidden;position:relative}
.post-image::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent 50%,rgba(0,0,0,.3));pointer-events:none}
.post-image img{width:100%;height:100%;object-fit:cover;transition:.5s}
.post-card:hover .post-image img{transform:scale(1.08)}
.post-content{padding:22px;display:flex;flex-direction:column;flex:1;gap:12px}
.post-category{display:inline-block;padding:5px 14px;background:rgba(255,107,0,.12);color:var(--primary-light);border:1px solid rgba(255,107,0,.25);border-radius:999px;font-size:.75rem;font-weight:700;width:fit-content}
.post-content h2{font-size:1.15rem;margin:0;line-height:1.6;font-weight:800}
.post-content h2 a{color:var(--text-main)}
.post-content h2 a:hover{color:var(--primary-light)}
.post-excerpt{color:var(--text-muted);font-size:.9rem;line-height:1.9;flex:1;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.post-meta{display:flex;gap:14px;flex-wrap:wrap;font-size:.78rem;color:var(--text-dim);padding-top:12px;border-top:1px solid var(--line)}
.post-meta span{display:inline-flex;align-items:center;gap:4px}
.read-more{display:inline-flex;align-items:center;gap:6px;color:var(--primary);font-weight:700;font-size:.88rem;padding-top:8px}
.read-more:hover{color:var(--primary-light);gap:10px}
.empty-state{grid-column:1/-1;text-align:center;padding:80px 30px;background:var(--bg-card);border:1px dashed rgba(255,107,0,.3);border-radius:var(--radius-lg);position:relative;overflow:hidden}
.empty-icon{width:120px;height:120px;margin:0 auto 24px;border-radius:50%;background:linear-gradient(135deg,rgba(255,107,0,.15),rgba(255,107,0,.05));display:flex;align-items:center;justify-content:center;position:relative}
.empty-icon::before{content:'';position:absolute;inset:-8px;border:2px dashed rgba(255,107,0,.25);border-radius:50%;animation:spin 20s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.empty-icon svg{width:60px;height:60px;color:var(--primary-light)}
.empty-state h3{font-size:1.5rem;font-weight:900;margin-bottom:10px;color:var(--text-main)}
.empty-state p{color:var(--text-muted);font-size:1rem;margin-bottom:24px;max-width:420px;margin-right:auto;margin-left:auto}
.empty-cta{display:inline-flex;align-items:center;gap:8px;padding:14px 32px;background:linear-gradient(135deg,var(--primary),var(--primary-light));color:#fff;border-radius:12px;font-weight:800;font-size:.95rem;box-shadow:0 10px 28px var(--primary-glow);transition:var(--transition)}
.empty-cta:hover{transform:translateY(-3px);box-shadow:0 16px 40px var(--primary-glow);color:#fff}
.empty-cta svg{width:18px;height:18px}
.post-detail{padding:40px 0}
.post-detail .container{max-width:880px}
.post-header{text-align:center;margin-bottom:40px}
.post-header h1{font-size:clamp(1.8rem,4.5vw,3rem);font-weight:900;line-height:1.35;margin:16px 0;color:#fff}
.post-header .post-meta{justify-content:center;gap:20px;font-size:.88rem;color:var(--text-muted);margin-top:16px}
.post-image-wrap{margin-bottom:40px;border-radius:var(--radius-lg);overflow:hidden;border:1px solid var(--line);box-shadow:0 20px 60px rgba(0,0,0,.4)}
.post-image-wrap img{width:100%;aspect-ratio:16/9;object-fit:cover}
.post-body{font-size:1.08rem;line-height:2.3;color:#d4d9e2}
.post-body p{margin-bottom:22px}
.post-body h2,.post-body h3{color:#fff;font-weight:800;margin:32px 0 14px}
.post-body a{color:var(--primary-light);border-bottom:1px dashed var(--primary)}
.post-body a:hover{color:var(--primary)}
.post-body blockquote{border-right:3px solid var(--primary);padding:10px 20px;margin:24px 0;background:rgba(255,107,0,.04);border-radius:0 10px 10px 0;color:#c6c9cf;font-style:italic}
.post-body ul,.post-body ol{padding-right:26px;margin-bottom:22px}
.post-body li{margin-bottom:8px}
.post-actions{display:flex;gap:14px;flex-wrap:wrap;padding:24px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:40px 0}
.action-btn{display:inline-flex;align-items:center;gap:8px;padding:11px 22px;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:10px;color:#fff;cursor:pointer;font-family:inherit;font-size:.9rem;font-weight:600;transition:var(--transition)}
.action-btn:hover{background:rgba(255,107,0,.1);border-color:var(--primary);color:var(--primary-light)}
.action-btn.liked{background:rgba(255,107,0,.15);border-color:var(--primary);color:var(--primary-light)}
.share-buttons{display:flex;align-items:center;gap:10px;margin-right:auto;flex-wrap:wrap}
.share-buttons>span{color:var(--text-muted);font-size:.85rem}
.share-btn{width:36px;height:36px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:.9rem;transition:var(--transition)}
.share-btn.whatsapp{background:#25d366}
.share-btn.telegram{background:#0088cc}
.share-btn.twitter{background:#1da1f2}
.share-btn.linkedin{background:#0077b5}
.share-btn:hover{transform:translateY(-3px);box-shadow:0 8px 20px rgba(0,0,0,.3)}
.related-posts{margin:50px 0}
.related-posts h2{font-size:1.4rem;margin-bottom:24px;display:flex;align-items:center;gap:10px}
.related-posts h2::before{content:'';width:4px;height:24px;background:var(--primary);border-radius:2px}
.related-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:20px}
.related-card{background:var(--bg-card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;transition:var(--transition);display:flex;flex-direction:column}
.related-card:hover{transform:translateY(-4px);border-color:rgba(255,107,0,.3);box-shadow:0 16px 40px rgba(0,0,0,.35)}
.related-image{display:block;aspect-ratio:16/10;overflow:hidden}
.related-image img{width:100%;height:100%;object-fit:cover;transition:.4s}
.related-card:hover .related-image img{transform:scale(1.06)}
.related-content{padding:18px;display:flex;flex-direction:column;gap:8px;flex:1}
.related-content h3{font-size:.98rem;line-height:1.5;font-weight:700}
.related-content h3 a{color:var(--text-main)}
.related-content h3 a:hover{color:var(--primary-light)}
.related-content p{color:var(--text-muted);font-size:.82rem;line-height:1.7;flex:1}
.related-date{color:var(--text-dim);font-size:.75rem}
.comments-section{margin-top:50px}
.comments-section>h2{font-size:1.4rem;margin-bottom:24px;display:flex;align-items:center;gap:10px}
.comments-section>h2::before{content:'';width:4px;height:24px;background:var(--primary);border-radius:2px}
.comment-count{color:var(--text-muted);font-size:.95rem;font-weight:600}
.comment-form-wrap{background:var(--bg-card);border:1px solid var(--line);border-radius:var(--radius-lg);padding:28px;margin-bottom:30px}
.comment-form-wrap h3{font-size:1.1rem;margin-bottom:18px;color:var(--primary-light);font-weight:800}
.comment-form{display:flex;flex-direction:column;gap:14px}
.form-row input,.form-row textarea{width:100%;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:10px;padding:12px 16px;color:#fff;font-family:inherit;font-size:.95rem;outline:none;transition:var(--transition)}
.form-row input:focus,.form-row textarea:focus{border-color:var(--primary);background:rgba(255,107,0,.04)}
.form-row textarea{resize:vertical;min-height:110px;line-height:1.9}
.submit-btn{padding:13px 32px;background:linear-gradient(135deg,var(--primary),var(--primary-light));color:#fff;border:none;border-radius:10px;font-weight:800;cursor:pointer;font-family:inherit;font-size:.95rem;transition:var(--transition);box-shadow:0 8px 20px var(--primary-glow);width:fit-content}
.submit-btn:hover{transform:translateY(-2px);box-shadow:0 12px 28px var(--primary-glow)}
.comments-list{display:flex;flex-direction:column;gap:16px;margin-bottom:20px}
.comment-card{background:var(--bg-card);border:1px solid var(--line);border-radius:var(--radius);padding:20px;transition:var(--transition);position:relative}
.comment-card::before{content:'';position:absolute;top:0;right:0;bottom:0;width:3px;background:var(--primary);border-radius:3px 0 0 3px;opacity:.5}
.comment-card:hover{border-color:var(--line-hover)}
.comment-header{display:flex;align-items:center;gap:14px;margin-bottom:12px}
.comment-avatar{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--primary-light));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:1.1rem;flex-shrink:0;box-shadow:0 4px 12px var(--primary-glow)}
.comment-info{flex:1}
.comment-info strong{display:block;font-size:.98rem;color:var(--text-main)}
.comment-info small{color:var(--text-dim);font-size:.78rem}
.comment-body{color:#c6c9cf;line-height:2;margin-bottom:12px;white-space:pre-wrap}
.comment-actions{display:flex;gap:10px}
.comment-action{padding:7px 14px;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:8px;color:#fff;cursor:pointer;font-family:inherit;font-size:.82rem;display:inline-flex;align-items:center;gap:6px;transition:var(--transition)}
.comment-action:hover{border-color:var(--primary);color:var(--primary-light)}
.load-more-btn{width:100%;padding:14px;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:10px;color:#fff;cursor:pointer;font-family:inherit;font-weight:700;font-size:.92rem;transition:var(--transition)}
.load-more-btn:hover{background:rgba(255,107,0,.1);border-color:var(--primary);color:var(--primary-light)}
.no-comments{text-align:center;color:var(--text-muted);padding:40px 20px;background:var(--bg-card);border:1px dashed var(--line);border-radius:var(--radius);font-size:.95rem}
.blog-footer{background:#000;padding:28px 0;border-top:1px solid var(--line);text-align:center;color:var(--text-muted);font-size:.85rem}
.blog-footer strong{color:var(--primary-light)}
@media (max-width:900px){.blog-layout{grid-template-columns:1fr;gap:30px}.blog-sidebar{position:static;order:2}.posts-grid{grid-template-columns:1fr 1fr}.nav-links{display:none}}
@media (max-width:600px){.posts-grid{grid-template-columns:1fr}.blog-hero{padding:80px 0 50px}.post-header h1{font-size:1.6rem}.share-buttons{width:100%;justify-content:flex-start}}
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
    {% include 'partials/blog_navbar.html' %}
    <main class="blog-main">{% block content %}{% endblock %}</main>
    {% include 'partials/blog_footer.html' %}
    <script>
    function getCookie(n){var v='; '+document.cookie;var p=v.split('; '+n+'=');if(p.length===2)return p.pop().split(';').shift();return '';}
    document.querySelectorAll('.like-btn').forEach(function(btn){btn.addEventListener('click',function(){var id=btn.dataset.id;fetch('/blog/api/posts/'+id+'/like/',{method:'POST',headers:{'X-CSRFToken':getCookie('csrftoken')}}).then(function(r){return r.json()}).then(function(d){if(d.success){btn.querySelector('.count').textContent=d.likes;btn.style.transform='scale(1.1)';setTimeout(function(){btn.style.transform=''},300);}});});});
    document.querySelectorAll('.like-comment-btn').forEach(function(btn){btn.addEventListener('click',function(){var id=btn.dataset.id;fetch('/blog/api/comments/'+id+'/like/',{method:'POST',headers:{'X-CSRFToken':getCookie('csrftoken')}}).then(function(r){return r.json()}).then(function(d){if(d.success)btn.querySelector('span').textContent=d.likes});});});
    document.querySelectorAll('.dislike-comment-btn').forEach(function(btn){btn.addEventListener('click',function(){var id=btn.dataset.id;fetch('/blog/api/comments/'+id+'/dislike/',{method:'POST',headers:{'X-CSRFToken':getCookie('csrftoken')}}).then(function(r){return r.json()}).then(function(d){if(d.success)btn.querySelector('span').textContent=d.dislikes});});});
    var form=document.getElementById('commentForm');if(form){form.addEventListener('submit',function(e){e.preventDefault();var fd=new FormData(form);fetch('/blog/api/comments/'+POST_ID+'/submit/',{method:'POST',body:fd,headers:{'X-CSRFToken':getCookie('csrftoken')}}).then(function(r){return r.json()}).then(function(d){if(d.success){alert(d.message);form.reset();}else{alert('خطا: '+d.error);}});});}
    var loadBtn=document.getElementById('loadMoreBtn');if(loadBtn){loadBtn.addEventListener('click',function(){var offset=parseInt(loadBtn.dataset.offset);var fd=new FormData();fd.append('offset',offset);fetch('/blog/api/comments/'+POST_ID+'/load/',{method:'POST',body:fd,headers:{'X-CSRFToken':getCookie('csrftoken')}}).then(function(r){return r.json()}).then(function(d){var list=document.getElementById('commentsList');d.comments.forEach(function(c){var div=document.createElement('div');div.className='comment-card';div.dataset.id=c.id;div.innerHTML='<div class="comment-header"><div class="comment-avatar">'+c.name[0]+'</div><div class="comment-info"><strong>'+c.name+'</strong><small>'+c.created+'</small></div></div><div class="comment-body">'+c.text+'</div><div class="comment-actions"><button class="comment-action like-comment-btn" data-id="'+c.id+'">👍 <span>'+c.likes+'</span></button><button class="comment-action dislike-comment-btn" data-id="'+c.id+'">👎 <span>'+c.dislikes+'</span></button></div>';list.appendChild(div);});loadBtn.dataset.offset=offset+d.comments.length;if(!d.has_more)loadBtn.style.display='none';});});}
    console.log('✅ Blog initialized');
    </script>
    {% block extra_js %}{% endblock %}
</body>
</html>
