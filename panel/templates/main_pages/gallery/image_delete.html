{% extends 'layouts/panel_base.html' %}
{% block content %}
<div class="page-header"><h1 class="page-title" style="color: #ef4444;">⚠️ حذف تصویر</h1></div>
<div class="form-card" style="max-width: 600px; text-align: center;">
    <p>آیا از حذف این تصویر از آلبوم "<strong>{{ image.album.title }}</strong>" اطمینان دارید؟</p>
    <img src="{{ image.image.url }}" style="max-width: 300px; border-radius: 8px; margin: 20px 0;">
    <form method="POST">
        {% csrf_token %}
        <a href="{% url 'panel:gallery_album_images' image.album.id %}" class="btn-ghost">انصراف</a>
        <button type="submit" class="btn-danger">بله، حذف شود</button>
    </form>
</div>
{% endblock %}
