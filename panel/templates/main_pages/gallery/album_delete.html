{% extends 'layouts/panel_base.html' %}
{% block title %}حذف آلبوم{% endblock %}

{% block content %}
<div class="card confirm-card">
    <div class="confirm-icon"><i class="fa-solid fa-triangle-exclamation"></i></div>
    <h2>حذف آلبوم «{{ album.title }}»</h2>
    <p>آیا از حذف این آلبوم و تمام تصاویر داخل آن اطمینان دارید؟<br>این عملیات قابل بازگشت نیست.</p>
    <form method="POST" class="confirm-actions">
        {% csrf_token %}
        <a href="{% url 'panel:gallery_album_list' %}" class="btn btn-ghost">انصراف</a>
        <button type="submit" class="btn btn-danger">
            <i class="fa-solid fa-trash-can"></i> بله، آلبوم حذف شود
        </button>
    </form>
</div>
{% endblock %}

{% block extra_js %}
<script>document.getElementById('pageTitle').textContent = 'حذف آلبوم';</script>
{% endblock %}
