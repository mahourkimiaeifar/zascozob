{% extends 'layouts/panel_base.html' %}
{% block content %}
<div class="page-header">
    <h1 class="page-title" style="color: #ef4444;">⚠️ حذف آلبوم</h1>
</div>
<div class="form-card" style="max-width: 600px; text-align: center;">
    <p>آیا از حذف آلبوم "<strong>{{ album.title }}</strong>" و تمام تصاویر داخل آن اطمینان دارید؟</p>
    <p style="color: #888; font-size: 0.9rem; margin-top: 10px;">این عملیات غیرقابل بازگشت است.</p>
    <form method="POST">
        {% csrf_token %}
        <a href="{% url 'panel:gallery_album_list' %}" class="btn-ghost">انصراف</a>
        <button type="submit" class="btn-danger">بله، آلبوم حذف شود</button>
    </form>
</div>
{% endblock %}
