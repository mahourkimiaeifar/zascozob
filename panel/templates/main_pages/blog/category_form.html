{% extends 'layouts/panel_base.html' %}

{% block title %}{% if category %}ویرایش دسته‌بندی{% else %}دسته‌بندی جدید{% endif %}{% endblock %}

{% block content %}
<div class="page-header">
    <h1 class="page-title">{% if category %}ویرایش دسته‌بندی{% else %}دسته‌بندی جدید{% endif %}</h1>
</div>

<form method="POST" class="form-card">
    {% csrf_token %}
    
    <div class="form-group">
        <label>عنوان دسته‌بندی</label>
        <input type="text" name="title" value="{{ category.title|default:'' }}" required>
    </div>
    
    <div class="form-group">
        <label>دسته مادر (اختیاری)</label>
        <select name="parent">
            <option value="">— بدون دسته مادر —</option>
            {% for p in parents %}
            <option value="{{ p.id }}" {% if category.parent_id == p.id %}selected{% endif %}>{{ p.title }}</option>
            {% endfor %}
        </select>
    </div>
    
    <div class="form-actions">
        <a href="{% url 'panel:blog_category_list' %}" class="btn-ghost">انصراف</a>
        <button type="submit" class="btn-primary">ذخیره</button>
    </div>
</form>
{% endblock %}
